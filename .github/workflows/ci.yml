name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simplerest
          POSTGRES_USER: simplerest
          POSTGRES_PASSWORD: simplerest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplerest -d simplerest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: simplerest
      POSTGRES_USER: simplerest
      POSTGRES_PASSWORD: simplerest
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python djangorest/manage.py check

      - name: No missing migrations
        run: python djangorest/manage.py makemigrations --check --dry-run

      - name: OpenAPI schema is valid
        run: python djangorest/manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Tests (PostgreSQL)
        run: pytest --cov=api --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
